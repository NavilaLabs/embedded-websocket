name: CI

on:
  push:
  pull_request:

# The toolchain is pinned so a new Rust release cannot break the build with new lints.
# Bump it deliberately and fix what the new lints find.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "asynch", "std", "std,asynch", "asynch,defmt"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy
      - run: cargo clippy --all-targets --features "${{ matrix.features }}"
      - run: cargo test --features "${{ matrix.features }}"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - run: cargo build --lib --features std,asynch,defmt

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo build --target thumbv7em-none-eabihf --features asynch,defmt

  format-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: llvm-tools
          targets: thumbv7em-none-eabihf
      - name: Measure this commit
        run: size/report.py measure > "$RUNNER_TEMP/current.json"
      - name: Measure master
        if: github.event_name == 'pull_request'
        run: |
          git worktree add "$RUNNER_TEMP/master" "origin/${{ github.base_ref }}"
          if [ -x "$RUNNER_TEMP/master/size/report.py" ]; then
            "$RUNNER_TEMP/master/size/report.py" measure > "$RUNNER_TEMP/master.json"
          fi
      - name: Report
        run: |
          baseline=""
          if [ -f "$RUNNER_TEMP/master.json" ]; then baseline="$RUNNER_TEMP/master.json"; fi
          size/report.py markdown "$RUNNER_TEMP/current.json" $baseline >> "$GITHUB_STEP_SUMMARY"

  embassy-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, llvm-tools
          targets: thumbv6m-none-eabi, riscv32imc-unknown-none-elf
      - name: Test the shared example code against a local TLS server
        working-directory: examples/embassy-common
        run: cargo clippy --all-targets && cargo test
      - name: Build the Raspberry Pi Pico W example
        working-directory: examples/embassy-pico-w
        run: ./fetch-firmware.sh && cargo clippy --release && cargo build --release
      - name: Build the ESP32-C3 example
        working-directory: examples/embassy-esp32c3
        # RUSTFLAGS replaces the linker arguments of .cargo/config.toml
        env:
          RUSTFLAGS: -D warnings -C link-arg=-Tlinkall.x -C force-frame-pointers
        run: cargo clippy --release && cargo build --release
      - name: Report the size of the board examples
        run: |
          size="$(rustc --print sysroot)/lib/rustlib/$(rustc --print host-tuple)/bin/llvm-size"
          {
            echo "### Board examples, for information"
            echo
            echo "Whole firmwares including WiFi, the network stack and TLS."
            echo
            echo '```'
            "$size" examples/embassy-pico-w/target/thumbv6m-none-eabi/release/embassy-pico-w \
              examples/embassy-esp32c3/target/riscv32imc-unknown-none-elf/release/embassy-esp32c3
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-11
      - run: cargo install cargo-fuzz --locked
      - run: fuzz/run.sh 60
        env:
          FUZZ_TOOLCHAIN: nightly-2026-06-11
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  autobahn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - run: autobahn/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autobahn-reports
          path: autobahn/reports
