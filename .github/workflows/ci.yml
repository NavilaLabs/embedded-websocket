name: CI

on:
  push:
  pull_request:

# The toolchain is pinned so a new Rust release cannot break the build with new lints.
# Bump it deliberately and fix what the new lints find.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "asynch", "std", "std,asynch"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy
      - run: cargo clippy --lib --examples --features "${{ matrix.features }}"
      - run: cargo test --features "${{ matrix.features }}"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - run: cargo build --lib --features std,asynch

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo build --target thumbv7em-none-eabihf --features asynch

  format-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  autobahn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - run: autobahn/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autobahn-reports
          path: autobahn/reports
