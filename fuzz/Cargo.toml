[package]
name = "embedded-io-websocket-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.10"
base64 = "0.23.1"
embedded-io = { version = "0.7.1", features = ["std"] }
embedded-io-websocket = { path = ".." }

# not part of the workspace of the library
[workspace]

[[bin]]
name = "head"
path = "fuzz_targets/head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request"
path = "fuzz_targets/request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "response"
path = "fuzz_targets/response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "framer"
path = "fuzz_targets/framer.rs"
test = false
doc = false
bench = false
