[package]
name = "embassy-pico-w"
version = "0.0.0"
edition = "2021"
publish = false
description = "A wss:// client and a ws:// echo server on a Raspberry Pi Pico W"

[dependencies]
embassy-common = { path = "../embassy-common" }
embassy-crypto = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1" }
embedded-io-websocket = { path = "../..", features = ["asynch", "defmt"] }

cyw43 = { version = "0.7.0", features = ["defmt"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-net = { version = "0.9.1", features = ["defmt", "tcp", "dhcpv4", "dns", "proto-ipv4", "medium-ethernet"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }

cortex-m-rt = "0.7.5"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
portable-atomic = { version = "1.11.1", features = ["critical-section"] }
rand_chacha = { version = "0.10.0", default-features = false }
rand_core = { version = "0.10.1", default-features = false }
static_cell = "2.1.1"

[profile.release]
debug = 2
lto = true
opt-level = "s"

# not part of the workspace of the library
[workspace]
