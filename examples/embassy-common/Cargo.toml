[package]
name = "embassy-common"
version = "0.0.0"
edition = "2021"
publish = false
description = "Application code shared by the embassy examples: a wss:// client and a ws:// echo server"

[dependencies]
embedded-io-websocket = { path = "../..", features = ["asynch"] }
embedded-io-async = "0.7.0"
embedded-tls = { version = "0.19.0", default-features = false }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "pkcs8"] }
sha2 = { version = "0.10.9", default-features = false }
rand_core = { version = "0.10.1", default-features = false }

[dev-dependencies]
embedded-io-adapters = { version = "0.7.0", features = ["tokio-1"] }
rand = "0.10.3"
rand_core_06 = { package = "rand_core", version = "0.6.4", features = ["getrandom"] }
aes-gcm = "0.10.3"
hkdf = "0.12.4"
hmac = "0.12.1"
p256 = { version = "0.13.2", features = ["ecdh"] }
rcgen = "0.14.10"
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

# not part of the workspace of the library
[workspace]
