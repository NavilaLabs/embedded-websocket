[package]
name = "embassy-common"
version = "0.0.0"
edition = "2021"
publish = false
description = "Application code shared by the embassy examples: a wss:// client and a ws:// echo server"

[dependencies]
embedded-io-websocket = { path = "../..", features = ["asynch"] }
embedded-io-async = "0.7.0"
# the release on crates.io (0.19.0) has two server authentication bypasses that are fixed on main
embedded-tls = { git = "https://github.com/embassy-rs/embedded-tls", rev = "0557076932c55f32e3e448566a99137012187aab", default-features = false, features = ["webpki", "p256", "p384"] }
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1", features = [
    "embassy-crypto-sha256",
    "embassy-crypto-sha384",
    "embassy-crypto-hmac-sha256",
    "embassy-crypto-aes128-gcm",
    "embassy-crypto-p256-arith",
    "embassy-crypto-p256-ecdh",
    "embassy-crypto-p256-ecdsa",
    "embassy-crypto-p384-arith",
    "embassy-crypto-p384-ecdsa",
] }
embassy-net = { version = "0.9.1", features = ["udp", "dns", "proto-ipv4", "medium-ethernet"] }
embassy-time = "0.5.1"
rand_core = { version = "0.10.1", default-features = false }

[dev-dependencies]
aes-gcm = "0.10.3"
embassy-crypto-rand = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1" }
embassy-time = { version = "0.5.1", features = ["std"] }
embedded-io-adapters = { version = "0.7.0", features = ["tokio-1"] }
hkdf = "0.12.4"
hmac = "0.12.1"
p256 = { version = "0.13.2", features = ["ecdh"] }
rand = "0.10.3"
rand_core_06 = { package = "rand_core", version = "0.6.4", features = ["getrandom"] }
rcgen = "0.14.10"
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

# not part of the workspace of the library
[workspace]
