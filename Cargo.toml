[package]
name = "embedded-io-websocket"
version = "0.1.0"
authors = ["David Haig", "NavilaLabs"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NavilaLabs/embedded-websocket"
description = "A lightweight no_std websocket library with blocking and async framers for embedded-io streams"
keywords = ["websocket", "embedded", "no_std", "embedded-io"]
categories = ["embedded", "no-std", "network-programming"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
sha1 = { version = "0.11.0", default-features = false }
heapless = { version = "0.9.3", default-features = false }
httparse = { version = "1.10.1", default-features = false }
rand_core = { version = "0.10.1", default-features = false }
base64 = { version = "0.23.1", default-features = false }
embedded-io = { version = "0.7.1", default-features = false }
embedded-io-async = { version = "0.7.0", default-features = false, optional = true }

[dev-dependencies]
rand = "0.10.3"
tokio = { version = "1.54.1", features = [
    "macros",
    "rt-multi-thread",
    "net",
] }
embedded-io-adapters = { version = "0.7.0", features = ["std", "tokio-1"] }

# see readme for no_std support
[features]
default = []
std = ["httparse/std", "embedded-io/std", "embedded-io-async?/std"]
asynch = ["dep:embedded-io-async"]

[[example]]
name = "client_async"
required-features = ["asynch"]

[[example]]
name = "server_async"
required-features = ["asynch"]

[[example]]
name = "autobahn_server"
path = "autobahn/server.rs"

[[example]]
name = "autobahn_client"
path = "autobahn/client.rs"
